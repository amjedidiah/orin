[project]
name = "orin"
version = "0.1.0"
description = "Routes each task to the best-fit AI model or agent, with shared context and a free fallback."
readme = "README.md"
authors = [
    { name = "Jedidiah Amaraegbu", email = "imunacode@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "openai>=3.39.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
orin = "orin:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
