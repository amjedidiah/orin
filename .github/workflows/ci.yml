name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      # Live router eval: trusted code only (pushes to main, never pull requests), and the
      # secret is scoped to this one step.
      - name: Router eval (live)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          ROUTER_MODEL: muse-spark-1.3-contributor
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "MODEL_API_KEY secret not set; skipping the live router eval."
            exit 0
          fi
          uv run python scripts/eval_router.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
